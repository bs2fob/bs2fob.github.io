<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bs2FoB</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="post.css">
<link rel="alternate" type="application/rss+xml" hreflang="ko" title="Bs2FoB (KO)" href="feed.ko.xml">
<link rel="alternate" type="application/rss+xml" hreflang="en" title="Bs2FoB (EN)" href="feed.en.xml">
<style>
.wrap{max-width:918px}

.site-head{border-bottom:1px solid var(--border);padding-block:40px 24px;margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-left{min-width:0}
.site-title{font-size:26px;font-weight:700;letter-spacing:.02em}
.site-sub{font-size:13px;color:var(--text2);margin-top:8px}
.head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

.lang-switch{display:flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.lang-btn{background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:6px 12px;cursor:pointer}
.lang-btn+.lang-btn{border-left:1px solid var(--border2)}
.lang-btn.active{background:var(--surface2);color:var(--text)}
.lang-btn:hover:not(.active){color:var(--text2)}

.feed-link{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;text-decoration:none}
.feed-link:hover{color:var(--accent);border-color:var(--accent)}

.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:26px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;margin-bottom:-1px;cursor:pointer}
.tab:hover:not(.on){color:var(--text2)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab-count{font-size:11px;font-weight:500;color:var(--text3);margin-left:6px}

.series{margin-bottom:34px}
.series-name{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

.post{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:border-color .15s;cursor:pointer}
.post:hover{border-color:var(--accent)}
.post-stamp{font-family:'Courier New',monospace;font-size:12px;color:var(--accent);letter-spacing:.04em}
.card-title{font-size:17px;font-weight:600;margin:6px 0 6px}
.post-lede{font-size:13px;color:var(--text2);line-height:1.7}
.card-foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;color:var(--text3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:2px 8px}
.tag.fallback{color:var(--accent);border-color:var(--accent)}
.dl{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:2px 8px;text-decoration:none}
.dl:hover{background:var(--surface2)}
.post.flat{cursor:default}
.post.flat:hover{border-color:var(--border)}

.empty{color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center}

.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:26px 0 34px}
.pg{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-family:inherit;font-size:13px;min-width:34px;padding:6px 10px;cursor:pointer}
.pg:hover:not(:disabled):not(.on){color:var(--text);border-color:var(--text3)}
.pg.on{background:var(--surface2);color:var(--text);border-color:var(--border2);cursor:default}
.pg:disabled{opacity:.35;cursor:default}
.pg-gap{color:var(--text3);font-size:13px;padding:0 2px}

.reader{max-width:680px;margin:0 auto}
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:none;color:var(--text3);font-family:inherit;font-size:13px;padding:0;cursor:pointer}
.back-btn:hover{color:var(--accent)}

#latest{max-width:680px;margin:0 auto;padding-top:34px;border-top:1px solid var(--border)}
#latest .post-head{padding-block:0 12px}
#latest .post-title{font-size:26px}
.latest-mark{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;text-align:center}

#notice{max-width:680px;margin:38px auto 0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:22px 26px 26px}
#notice .post-head{padding-block:0 10px}
#notice .post-title{font-size:17px}
#notice .post-stamp{font-size:11px}
#notice p{font-size:15px;color:var(--text);margin-bottom:.9em;line-height:1.8}
#notice p:last-child{margin-bottom:0}
.notice-mark{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div class="head-left">
      <div class="site-title">Bs2FoB</div>
      <div class="site-sub" id="site-sub"></div>
    </div>
    <div class="head-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ko">KO</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <a class="feed-link" id="feed-link" href="feed.ko.xml">RSS</a>
    </div>
  </header>

  <div id="index-view">
    <nav class="tabbar" id="tabbar"></nav>
    <main id="list"></main>
    <nav class="pager" id="pager" hidden></nav>
    <section id="latest" hidden></section>
    <section id="notice" hidden></section>
  </div>

  <div id="reader" class="reader" hidden>
    <nav class="reader-bar"><button class="back-btn" id="back"></button></nav>
    <div id="reader-body"></div>
  </div>

</div>

<script>
// 글을 목록 안에서 펼치고 주소는 바꾸지 않는다
(function(){
  var STORE = 'bs2fob-lang';
  var PER_PAGE = 10;
  var TABS = ['notice', 'write', 'code'];
  var DEFAULT_TAB = 'write';

  var UI = {
    ko: { sub: '확보된 거점 &mdash; 세운 것을 다음 출발점으로 넘긴다',
          empty: '아직 게시된 글이 없습니다.',
          fail: '목록을 불러오지 못했습니다.',
          fallback: '한국어 원문', latest: '최근 글', back: '← 목록', notice: '공지',
          tab: { notice: '공지', write: '작문', code: '코딩' } },
    en: { sub: 'Established footholds &mdash; each one becomes the next starting point',
          empty: 'No posts yet.',
          fail: 'Failed to load the index.',
          fallback: 'Korean original', latest: 'Latest', back: '← Index', notice: 'Notice',
          tab: { notice: 'Notice', write: 'Writing', code: 'Code' } }
  };

  var tabbarEl = document.getElementById('tabbar');
  var noticeEl = document.getElementById('notice');
  var listEl = document.getElementById('list');
  var pagerEl = document.getElementById('pager');
  var latestEl = document.getElementById('latest');
  var indexEl = document.getElementById('index-view');
  var readerEl = document.getElementById('reader');
  var bodyEl = document.getElementById('reader-body');
  var subEl = document.getElementById('site-sub');
  var backEl = document.getElementById('back');

  var lang = pickLang();
  var posts = null;
  var current = null;
  var tab = DEFAULT_TAB;
  var page = 0;
  var cache = {};

  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.lang); });
  });
  backEl.addEventListener('click', function(){ history.back(); });
  window.addEventListener('popstate', function(e){
    apply(e.state || {});
  });

  paintChrome();
  fetch('posts.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      posts = d;
      posts.sort(function(a, b){ return (b.stamp || '').localeCompare(a.stamp || ''); });
      if (!history.state) {
        history.replaceState({ stamp: null, tab: DEFAULT_TAB, page: 0 }, '', location.pathname);
      }
      apply(history.state || {});
    })
    .catch(function(){
      listEl.innerHTML = '<div class="empty">' + UI[lang].fail + '</div>';
    });

  function pickLang(){
    var saved;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (saved === 'ko' || saved === 'en') return saved;
    return /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
  }

  function setLang(next){
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem(STORE, next); } catch (e) {}
    cache = {};
    paintChrome();
    apply({ stamp: current, tab: tab, page: page });
  }

  function paintChrome(){
    document.documentElement.lang = lang;
    subEl.innerHTML = UI[lang].sub;
    backEl.textContent = UI[lang].back;
    document.getElementById('feed-link').href = 'feed.' + lang + '.xml';
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  function find(stamp){
    for (var i = 0; i < posts.length; i++) {
      if (posts[i].stamp === stamp) return posts[i];
    }
    return null;
  }

  // 주소가 바뀌지 않으므로 화면이 바뀔 때마다 직접 집계를 부른다
  var pending = [];
  function count(path, title){
    var hit = { path: path, title: title, event: false };
    var gc = window.goatcounter;
    if (gc && gc.count) gc.count(hit);
    else pending.push(hit);          // 스크립트가 아직 안 왔으면 모아 둔다
  }
  window.addEventListener('load', function(){
    var gc = window.goatcounter;
    if (!gc || !gc.count) return;
    while (pending.length) gc.count(pending.shift());
  });

  function apply(state){
    if (!posts) return;
    var post = state.stamp ? find(state.stamp) : null;
    current = post ? post.stamp : null;
    tab = TABS.indexOf(state.tab) >= 0 ? state.tab : DEFAULT_TAB;
    page = clampPage(state.page || 0);

    if (post) {
      indexEl.hidden = true;
      readerEl.hidden = false;
      load(post, bodyEl);
    } else {
      readerEl.hidden = true;
      indexEl.hidden = false;
      renderList();
    }
    window.scrollTo(0, 0);

    if (post) {
      var v = pick(post);
      if (v) count('/' + v.v.file, v.v.title);
    } else {
      count('/' + tab + (page ? '/p' + (page + 1) : ''),
            UI[lang].tab[tab] + (page ? ' ' + (page + 1) : ''));
    }
  }

  function tabOf(p){
    return TABS.indexOf(p.tab) >= 0 ? p.tab : DEFAULT_TAB;
  }

  function tabPosts(which){
    return posts.filter(function(p){ return tabOf(p) === (which || tab); });
  }

  function pageCount(){
    return Math.max(1, Math.ceil(tabPosts().length / PER_PAGE));
  }

  function clampPage(n){
    if (!posts) return 0;
    return Math.min(Math.max(0, n | 0), pageCount() - 1);
  }

  function openPost(post){
    if (!post) return;
    history.pushState({ stamp: post.stamp, tab: tab, page: page }, '', location.pathname);
    apply({ stamp: post.stamp, tab: tab, page: page });
  }

  function goPage(n){
    n = clampPage(n);
    if (n === page && !current) return;
    history.pushState({ stamp: null, tab: tab, page: n }, '', location.pathname);
    apply({ stamp: null, tab: tab, page: n });
  }

  function goTab(t){
    if (t === tab && !current) return;
    history.pushState({ stamp: null, tab: t, page: 0 }, '', location.pathname);
    apply({ stamp: null, tab: t, page: 0 });
  }

  function renderTabs(){
    tabbarEl.innerHTML = '';
    TABS.forEach(function(t){
      var n = tabPosts(t).length;
      var b = document.createElement('button');
      b.className = 'tab' + (t === tab ? ' on' : '');
      b.textContent = UI[lang].tab[t];
      if (n) {
        var c = document.createElement('span');
        c.className = 'tab-count';
        c.textContent = n;
        b.appendChild(c);
      }
      b.addEventListener('click', function(){ goTab(t); });
      tabbarEl.appendChild(b);
    });
  }

  function renderList(){
    latestEl.hidden = true;
    latestEl.innerHTML = '';
    pagerEl.hidden = true;
    pagerEl.innerHTML = '';
    renderTabs();
    renderNotice();

    var mine = tabPosts();
    if (!mine.length) {
      listEl.innerHTML = '<div class="empty">' + UI[lang].empty + '</div>';
      return;
    }

    // 페이지를 먼저 자르고 그 안에서 시리즈를 묶는다
    var slice = mine.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
    var groups = [], index = {};
    slice.forEach(function(p){
      var key = seriesName(p);
      if (!(key in index)) { index[key] = groups.length; groups.push({ name: key, items: [] }); }
      groups[index[key]].items.push(p);
    });

    listEl.innerHTML = groups.map(function(g){
      return '<section class="series">'
        + (g.name ? '<div class="series-name">' + esc(g.name) + '</div>' : '')
        + g.items.map(card).join('')
        + '</section>';
    }).join('');

    listEl.querySelectorAll('.post:not(.flat)').forEach(function(el){
      el.addEventListener('click', function(){ openPost(find(el.dataset.stamp)); });
    });
    listEl.querySelectorAll('.dl').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); });
    });

    renderPager();

    if (page === 0 && mine[0] && pick(mine[0])) {
      var mark = document.createElement('div');
      mark.className = 'latest-mark';
      mark.textContent = UI[lang].latest;
      latestEl.appendChild(mark);
      load(mine[0], latestEl, function(){ latestEl.hidden = false; });
    }
  }

  // 앞뒤 두 칸과 양 끝만 남기고 사이는 생략표로 접는다
  function renderPager(){
    var total = pageCount();
    if (total < 2) return;

    add('‹', page - 1, false, page === 0);
    var last = -1;
    for (var i = 0; i < total; i++) {
      if (i > 1 && i < total - 2 && Math.abs(i - page) > 1) continue;
      if (last >= 0 && i - last > 1) {
        var gap = document.createElement('span');
        gap.className = 'pg-gap';
        gap.textContent = '…';
        pagerEl.appendChild(gap);
      }
      add(String(i + 1), i, i === page, false);
      last = i;
    }
    add('›', page + 1, false, page === total - 1);

    pagerEl.hidden = false;

    function add(label, target, on, off){
      var b = document.createElement('button');
      b.className = 'pg' + (on ? ' on' : '');
      b.textContent = label;
      b.disabled = !!off || !!on;
      if (!off && !on) b.addEventListener('click', function(){ goPage(target); });
      pagerEl.appendChild(b);
    }
  }

  // 가장 최근 공지를 목록 맨 아래에 걸어 둔다. 공지 탭에서는 위에 이미 있으므로 건다
  function renderNotice(){
    noticeEl.hidden = true;
    noticeEl.innerHTML = '';
    if (tab === 'notice') return;

    var latest = tabPosts('notice')[0];
    if (!latest || !pick(latest)) return;

    var mark = document.createElement('div');
    mark.className = 'notice-mark';
    mark.textContent = UI[lang].notice;
    noticeEl.appendChild(mark);
    load(latest, noticeEl, function(){ noticeEl.hidden = false; });
  }

  function seriesName(p){
    var s = p.series;
    if (!s) return '';
    return typeof s === 'string' ? s : (s[lang] || s.ko || s.en || '');
  }

  function pick(p){
    var v = p[lang];
    if (v && v.file) return { v: v, fell: false };
    v = p.ko || p.en;
    return v && v.file ? { v: v, fell: true } : null;
  }

  // 본문 없이 내려받을 것만 있는 항목도 카드로 선다
  function card(p){
    var got = pick(p);
    var meta = got ? got.v : (p[lang] || p.ko || p.en || {});
    var foot = [];

    if (got && got.fell) foot.push('<span class="tag fallback">' + UI[lang].fallback + '</span>');
    (p.tags || []).forEach(function(t){ foot.push('<span class="tag">' + esc(t) + '</span>'); });
    if (p.download) {
      foot.push('<a class="dl" href="' + esc(p.download) + '" download>'
        + esc(p.downloadLabel || 'DOWNLOAD') + '</a>');
    }

    return '<div class="post' + (got ? '' : ' flat') + '" data-stamp="' + esc(p.stamp) + '">'
      + '<div class="post-stamp">' + esc(p.stamp || '') + '</div>'
      + '<div class="card-title">' + esc(meta.title || '') + '</div>'
      + (meta.lede ? '<div class="post-lede">' + esc(meta.lede) + '</div>' : '')
      + (foot.length ? '<div class="card-foot">' + foot.join('') + '</div>' : '')
      + '</div>';
  }

  // 글 HTML 에서 본문만 떼어 온다. 이미지 경로는 목록 기준으로 옮긴다
  function load(post, target, done){
    var got = pick(post);
    if (!got) return;
    var file = got.v.file;

    if (cache[file]) { paint(target, cache[file], done); return; }

    fetch(file)
      .then(function(r){ return r.text(); })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var parts = doc.querySelectorAll('.post-head, .epigraph, .ep-trans, main');
        if (!parts.length) return;

        var frag = document.createDocumentFragment();
        Array.prototype.forEach.call(parts, function(el){
          frag.appendChild(document.importNode(el, true));
        });

        var base = file.replace(/[^/]+$/, '');
        Array.prototype.forEach.call(frag.querySelectorAll('img'), function(img){
          var src = img.getAttribute('src') || '';
          if (src && src.charAt(0) !== '/' && src.indexOf('://') < 0) {
            img.setAttribute('src', base + src);
          }
        });

        cache[file] = frag;
        paint(target, frag, done);
      })
      .catch(function(){});
  }

  function paint(target, frag, done){
    if (target === bodyEl) target.innerHTML = '';
    target.appendChild(frag.cloneNode(true));
    if (done) done();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
<script data-goatcounter="https://bs2fob.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload": true}'
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
