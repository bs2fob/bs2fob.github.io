<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bs2FoB</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="post.css?v=23">
<link rel="stylesheet" href="verse.css?v=3">
<link rel="alternate" type="application/rss+xml" hreflang="ko" title="Bs2FoB (KO)" href="feed.ko.xml">
<link rel="alternate" type="application/rss+xml" hreflang="en" title="Bs2FoB (EN)" href="feed.en.xml">
<style>
.wrap{max-width:918px}

.site-head{position:relative;border-bottom:1px solid var(--border);padding-block:40px 24px;margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:nowrap}
.head-left{order:1;min-width:0;flex:1 1 auto}
.site-title{font-size:26px;font-weight:700;letter-spacing:.02em;cursor:pointer;display:inline-block}
.site-title:hover{color:var(--accent)}
.site-sub{font-size:13px;color:var(--text2);margin-top:8px}
.head-right{order:3;display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex-shrink:0;flex-grow:0}
.head-btns{display:flex;align-items:center;gap:8px}
.head-clock{position:absolute;left:50%;top:40px;transform:translateX(-50%);line-height:48px;font-family:D2,Consolas,monospace;font-size:17px;font-weight:700;color:var(--text);letter-spacing:.04em;white-space:nowrap;pointer-events:none}
@media (max-width:620px){.head-clock{display:none}}

.lang-switch{display:flex;border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden}
.lang-btn{background:none;border:none;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;padding:6px 12px;cursor:pointer}
.lang-btn+.lang-btn{border-left:1px solid var(--border2)}
.lang-btn.active{background:var(--surface2);color:var(--text)}
.lang-btn:hover:not(.active){color:var(--text2)}

.feed-link{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 12px;text-decoration:none}
.feed-link:hover{color:var(--accent);border-color:var(--accent)}

.hits{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--text3);letter-spacing:.04em}
.hits b{font-family:'Courier New',monospace;font-size:12px;font-weight:600;color:var(--text2);margin-left:4px}
.hits .today b{color:var(--accent)}

.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:26px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;margin-bottom:-1px;cursor:pointer}
.tab:hover:not(.on){color:var(--text2)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab-count{font-size:11px;font-weight:500;color:var(--text3);margin-left:6px}
@media (max-width:520px){.tabbar{flex-wrap:wrap;row-gap:0}.tab{font-size:13px;padding:9px 9px}.tab-count{margin-left:3px}}

.lex-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.lex-item:hover{border-color:var(--accent)}
.lex-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lex-term{font-size:16px;font-weight:600}
.lex-alt{font-family:'Courier New',monospace;font-size:12px;color:var(--text3)}
.lex-short{font-size:13px;color:var(--text2);line-height:1.7;margin-top:6px}
.lex-body{font-size:14px;color:var(--text);line-height:1.85;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.lex-body p{margin-bottom:.9em}
.lex-body p:last-child{margin-bottom:0}
.lex-see{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.lex-see span{font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:4px;padding:2px 8px}

.series{margin-bottom:34px}
.series-name{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;margin-bottom:12px}

.post{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:border-color .15s;cursor:pointer}
.post:hover{border-color:var(--accent)}
.post-stamp{font-family:'Courier New',monospace;font-size:12px;color:var(--accent);letter-spacing:.04em}
.card-title{font-size:17px;font-weight:600;margin:6px 0 6px}
.post-lede{font-size:13px;color:var(--text2);line-height:1.7}
.card-foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;color:var(--text3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:2px 8px}
.tag.fallback{color:var(--accent);border-color:var(--accent)}
.dl{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:2px 8px;text-decoration:none}
.dl:hover{background:var(--surface2)}
.post.flat{cursor:default}
.post.flat:hover{border-color:var(--border)}

.empty{color:var(--text3);font-size:13px;border:1px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center}

.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:26px 0 34px}
.pg{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-family:inherit;font-size:13px;min-width:34px;padding:6px 10px;cursor:pointer}
.pg:hover:not(:disabled):not(.on){color:var(--text);border-color:var(--text3)}
.pg.on{background:var(--surface2);color:var(--text);border-color:var(--border2);cursor:default}
.pg:disabled{opacity:.35;cursor:default}
.pg-gap{color:var(--text3);font-size:13px;padding:0 2px}

.reader{max-width:680px;margin:0 auto}
.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px;border-bottom:1px solid var(--border)}
.back-btn{background:none;border:none;color:var(--text3);font-family:inherit;font-size:13px;padding:0;cursor:pointer}
.back-btn:hover{color:var(--accent)}
.post-nav{display:flex;justify-content:space-between;gap:12px;margin:40px 0 34px;padding-top:22px;border-top:1px solid var(--border)}
.pn{flex:1 1 0;min-width:0;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text3);font-family:inherit;font-size:13px;padding:10px 12px;cursor:pointer;text-align:left}
.pn.next{text-align:right}
.pn:hover{color:var(--text);border-color:var(--text3)}
.pn b{display:block;font-weight:normal;font-size:12px;margin-bottom:4px}
.pn span{display:block;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-empty{flex:1 1 0}

#latest{max-width:680px;margin:0 auto;padding-top:34px;border-top:1px solid var(--border)}
#latest .post-head{padding-block:0 12px}
#latest .post-title{font-size:26px}
.latest-mark{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;text-align:center}

#notice{max-width:680px;margin:38px auto 0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:22px 26px 26px}
#notice .post-head{padding-block:0 10px}
#notice .post-title{font-size:17px}
#notice .post-stamp{font-size:11px}
#notice p{font-size:15px;color:var(--text);margin-bottom:.9em;line-height:1.8}
#notice p:last-child{margin-bottom:0}
#notice .quote p{color:var(--text2);margin:0}
.notice-mark{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div class="head-right">
      <div class="head-btns">
        <div class="lang-switch">
          <button class="lang-btn" data-lang="ko">KO</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a class="feed-link" id="feed-link" href="feed.ko.xml">RSS</a>
      </div>
      <div class="hits" id="hits" hidden>
        <span class="today">TODAY<b id="hit-today">-</b></span>
        <span class="total">TOTAL<b id="hit-total">-</b></span>
      </div>
    </div>
    <div class="head-left">
      <div class="site-title" id="home" title="처음 화면">Bs2FoB</div>
      <div class="site-sub" id="site-sub"></div>
    </div>
    <div class="head-clock" id="clock"></div>
  </header>

  <div id="index-view">
    <nav class="tabbar" id="tabbar"></nav>
    <main id="list"></main>
    <nav class="pager" id="pager" hidden></nav>
    <section id="latest" hidden></section>
    <section id="notice" hidden></section>
  </div>

  <div id="reader" class="reader" hidden>
    <nav class="reader-bar"><button class="back-btn" id="back"></button></nav>
    <div id="reader-body"></div>
    <nav class="post-nav" id="post-nav" hidden></nav>
  </div>

</div>

<script>
// 글을 목록 안에서 펼치고 주소는 바꾸지 않는다
(function(){
  var STORE = 'bs2fob-lang';
  var PER_PAGE = 5;
  var TABS = ['notice', 'verse', 'write', 'lexicon', 'snap', 'code'];
  var DEFAULT_TAB = 'write';

  var UI = {
    ko: { sub: '확보된 거점 &mdash; 세운 것을 다음 출발점으로 넘긴다',
          empty: '아직 게시된 글이 없습니다.',
          fail: '목록을 불러오지 못했습니다.',
          fallback: '한국어 원문', latest: '최근 글', back: '← 목록', prev: '← 이전 글', next: '다음 글 →', notice: '로그',
          lexEmpty: '아직 등록된 술어가 없습니다.',
          tab: { notice: '로그', verse: '시문', write: '작문', lexicon: '술어', snap: '스냅', code: '코딩' } },
    en: { sub: 'Established footholds &mdash; each one becomes the next starting point',
          empty: 'No posts yet.',
          fail: 'Failed to load the index.',
          fallback: 'Korean original', latest: 'Latest', back: '← Index', prev: '← Previous', next: 'Next →', notice: 'Log',
          lexEmpty: 'No entries yet.',
          tab: { notice: 'Log', verse: 'Verse', write: 'Writing', lexicon: 'Lexicon', snap: 'Snap', code: 'Code' } }
  };

  var clockEl = document.getElementById('clock');
  var tabbarEl = document.getElementById('tabbar');
  var noticeEl = document.getElementById('notice');
  var listEl = document.getElementById('list');
  var pagerEl = document.getElementById('pager');
  var latestEl = document.getElementById('latest');
  var indexEl = document.getElementById('index-view');
  var readerEl = document.getElementById('reader');
  var bodyEl = document.getElementById('reader-body');
  var subEl = document.getElementById('site-sub');
  var backEl = document.getElementById('back');
  var postNavEl = document.getElementById('post-nav');

  var lang = pickLang();
  var posts = null;
  var current = null;
  var tab = DEFAULT_TAB;
  var page = 0;
  var cache = {};
  var lexicon = null;

  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.lang); });
  });
  backEl.addEventListener('click', function(){ history.back(); });
  document.getElementById('home').addEventListener('click', goHome);
  document.addEventListener('click', playClip);
  document.addEventListener('click', followXref);
  window.addEventListener('popstate', function(e){
    apply(e.state || {});
  });

  paintChrome();
  startClock();
  loadHits();
  fetch('lexicon.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ lexicon = d || []; sortTerms(); if (posts) renderTabs(); })
    .catch(function(){ lexicon = []; });

  fetch('posts.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      posts = d;
      posts.sort(function(a, b){ return (b.stamp || '').localeCompare(a.stamp || ''); });
      if (!history.state) {
        history.replaceState({ stamp: null, tab: DEFAULT_TAB, page: 0, home: true }, '', location.pathname);
      }
      apply(history.state || {});
    })
    .catch(function(){
      listEl.innerHTML = '<div class="empty">' + UI[lang].fail + '</div>';
    });

  // 머리글 시계. 주차코드와 음력 일자를 필자의 좌표인 서울 시각으로 그린다
  function startClock(){
    tick();
    setTimeout(function(){ tick(); setInterval(tick, 1000); }, 1000 - Date.now() % 1000);
  }

  function tick(){
    var p = seoulParts(new Date());
    clockEl.textContent = weekStamp(p) + '_' + p.month + p.day
      + ' m' + lunarDay(p) + ' ' + p.hour + ':' + p.minute + ':' + p.second;
  }

  function seoulParts(d){
    var f = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).formatToParts(d);
    var o = {};
    f.forEach(function(x){ if (x.type !== 'literal') o[x.type] = x.value; });
    if (o.hour === '24') o.hour = '00';
    o.at = new Date(o.year + '-' + o.month + '-' + o.day + 'T12:00:00Z');
    return o;
  }

  // 그 해 1월 1일이 속한 주의 일요일부터 몇 주 지났는지로 주차를 센다
  function weekStamp(p){
    var jan1 = new Date(Date.UTC(+p.year, 0, 1, 12));
    var firstSunday = new Date(jan1.getTime() - jan1.getUTCDay() * 86400000);
    var week = Math.floor((p.at - firstSunday) / 604800000) + 1;
    return p.year.slice(2) + 'w' + pad2(week) + p.at.getUTCDay();
  }

  // 음력 일자가 곧 달의 위상이다. 1 이 삭, 15 가 망이다
  function lunarDay(p){
    try {
      return pad2(+new Intl.DateTimeFormat('en-u-ca-chinese', {
        timeZone: 'UTC', day: 'numeric'
      }).format(p.at));
    } catch (e) { return '--'; }
  }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  // 방문 수는 GoatCounter 가 조회 문자열별로 캐시하므로 end 를 분마다 다른 미래 날짜로 준다
  function loadHits(){
    var base = 'https://bs2fob.goatcounter.com/counter/TOTAL.json';
    var d = new Date();

    function ymd(x){
      return x.getFullYear() + '-'
        + String(x.getMonth() + 1).padStart(2, '0') + '-'
        + String(x.getDate()).padStart(2, '0');
    }

    var today = ymd(d);
    var tomorrow = ymd(new Date(d.getTime() + 86400000 * (1 + Math.floor(d.getTime() / 60000) % 3000)));

    Promise.all([
      fetch(base + '?start=2026-01-01&end=' + tomorrow).then(function(r){ return r.json(); }),
      fetch(base + '?start=' + today + '&end=' + tomorrow).then(function(r){ return r.json(); })
    ]).then(function(r){
      document.getElementById('hit-total').textContent = r[0].count;
      document.getElementById('hit-today').textContent = r[1].count;
      document.getElementById('hits').hidden = false;
    }).catch(function(){});
  }

  function pickLang(){
    var saved;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (saved === 'ko' || saved === 'en') return saved;
    return /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
  }

  function setLang(next){
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem(STORE, next); } catch (e) {}
    cache = {};
    if (lexicon) sortTerms();
    paintChrome();
    apply({ stamp: current, tab: tab, page: page });
  }

  function paintChrome(){
    document.documentElement.lang = lang;
    subEl.innerHTML = UI[lang].sub;
    backEl.textContent = UI[lang].back;
    document.getElementById('feed-link').href = 'feed.' + lang + '.xml';
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  function find(stamp){
    for (var i = 0; i < posts.length; i++) {
      if (posts[i].stamp === stamp) return posts[i];
    }
    return null;
  }

  // 주소가 바뀌지 않으므로 화면이 바뀔 때마다 직접 집계를 부른다
  var pending = [];
  function count(path, title){
    var hit = { path: path, title: title, event: false };
    var gc = window.goatcounter;
    if (gc && gc.count) gc.count(hit);
    else pending.push(hit);          // 스크립트가 아직 안 왔으면 모아 둔다
  }
  window.addEventListener('load', function(){
    var gc = window.goatcounter;
    if (!gc || !gc.count) return;
    while (pending.length) gc.count(pending.shift());
  });

  var home = false;
  function apply(state){
    if (!posts) return;
    var post = state.stamp ? find(state.stamp) : null;
    current = post ? post.stamp : null;
    tab = TABS.indexOf(state.tab) >= 0 ? state.tab : DEFAULT_TAB;
    page = clampPage(state.page || 0);
    home = !!state.home && !post;

    fitViewport(!!post);
    if (post) {
      indexEl.hidden = true;
      readerEl.hidden = false;
      load(post, bodyEl);
      renderPostNav(post);
    } else {
      readerEl.hidden = true;
      indexEl.hidden = false;
      renderList();
    }
    window.scrollTo(0, 0);

    if (post) {
      var v = pick(post);
      if (v) count('/' + v.v.file, v.v.title);
    } else {
      count('/' + tab + (page ? '/p' + (page + 1) : ''),
            UI[lang].tab[tab] + (page ? ' ' + (page + 1) : ''));
    }
  }

  // 폰에서 글을 열면 시구가 줄바꿈되지 않는 폭으로 그린 뒤 화면에 맞춰 줄인다
  var READ_WIDTH = 500;
  function fitViewport(reading){
    var m = document.querySelector('meta[name=viewport]');
    m.content = reading && screen.width < READ_WIDTH
      ? 'width=' + READ_WIDTH
      : 'width=device-width, initial-scale=1.0';
  }

  function tabOf(p){
    return TABS.indexOf(p.tab) >= 0 ? p.tab : DEFAULT_TAB;
  }

  function tabPosts(which){
    return posts.filter(function(p){ return tabOf(p) === (which || tab); });
  }

  function pageCount(){
    return Math.max(1, Math.ceil(tabPosts().length / PER_PAGE));
  }

  function clampPage(n){
    if (!posts) return 0;
    return Math.min(Math.max(0, n | 0), pageCount() - 1);
  }

  // 본문의 연작 참조 링크는 읽던 자리를 두고 새 창에서 그 글의 해당 장을 연다
  function followXref(e){
    var a = e.target.closest && e.target.closest('a.xref');
    if (!a || !posts) return;
    var parts = (a.getAttribute('href') || '').split('#');
    var name = parts[0].replace(/^.*\//, '').replace(/\.(ko|en)\.html$/, '');
    var post = null;
    posts.forEach(function(p){
      ['ko', 'en'].forEach(function(l){
        if (p[l] && p[l].file && p[l].file.indexOf(name + '.') >= 0) post = p;
      });
    });
    var got = post && pick(post);
    if (!got) return;
    e.preventDefault();
    window.open(got.v.file + (parts[1] ? '#' + parts[1] : ''), '_blank', 'noopener');
  }

  // 같은 탭 안에서 목록 순서로 앞뒤 글을 잇는다. 목록이 최신순이므로 뒤쪽이 이전 글이다
  function renderPostNav(post){
    var list = tabPosts(tabOf(post)).filter(function(p){ return pick(p); });
    var i = list.indexOf(post);
    postNavEl.innerHTML = '';
    postNavEl.hidden = i < 0 || list.length < 2;
    if (postNavEl.hidden) return;
    add(list[i + 1], 'prev');
    add(list[i - 1], 'next');

    function add(p, kind){
      if (!p) {
        var gap = document.createElement('div');
        gap.className = 'pn-empty';
        postNavEl.appendChild(gap);
        return;
      }
      var b = document.createElement('button');
      b.className = 'pn ' + kind;
      b.innerHTML = '<b>' + UI[lang][kind] + '</b><span>' + esc(((seriesNo(p) ? seriesNo(p) + ' ' : '') + (pick(p).v.title || ''))) + '</span>';
      b.title = pick(p).v.title || '';
      b.addEventListener('click', function(){ openPost(p); });
      postNavEl.appendChild(b);
    }
  }

  function openPost(post){
    if (!post) return;
    history.pushState({ stamp: post.stamp, tab: tab, page: page }, '', location.pathname);
    apply({ stamp: post.stamp, tab: tab, page: page });
  }

  function goPage(n){
    n = clampPage(n);
    if (n === page && !current) return;
    history.pushState({ stamp: null, tab: tab, page: n, home: home }, '', location.pathname);
    apply({ stamp: null, tab: tab, page: n, home: home });
  }

  // 표제를 누르면 처음 들어왔을 때의 화면으로 돌아간다
  function goHome(){
    if (!posts) return;
    if (home) { window.scrollTo(0, 0); return; }
    history.pushState({ stamp: null, tab: DEFAULT_TAB, page: 0, home: true }, '', location.pathname);
    apply({ stamp: null, tab: DEFAULT_TAB, page: 0, home: true });
  }

  function goTab(t){
    if (t === tab && !current && !home) return;
    history.pushState({ stamp: null, tab: t, page: 0 }, '', location.pathname);
    apply({ stamp: null, tab: t, page: 0 });
  }

  function renderTabs(){
    tabbarEl.innerHTML = '';
    TABS.forEach(function(t){
      var n = t === 'lexicon' ? (lexicon ? lexicon.length : 0) : tabPosts(t).length;
      var b = document.createElement('button');
      b.className = 'tab' + (t === tab ? ' on' : '');
      b.textContent = UI[lang].tab[t];
      if (n) {
        var c = document.createElement('span');
        c.className = 'tab-count';
        c.textContent = n;
        b.appendChild(c);
      }
      b.addEventListener('click', function(){ goTab(t); });
      tabbarEl.appendChild(b);
    });
  }

  function renderList(){
    latestEl.hidden = true;
    latestEl.innerHTML = '';
    pagerEl.hidden = true;
    pagerEl.innerHTML = '';
    renderTabs();
    renderNotice();

    if (tab === 'lexicon') { renderLexicon(); return; }

    var mine = tabPosts();
    if (!mine.length) {
      listEl.innerHTML = '<div class="empty">' + UI[lang].empty + '</div>';
      return;
    }

    // 작문·시문 탭은 첫 편부터 읽도록 정순으로 늘어놓고, 페이지를 자른 뒤 시리즈를 묶는다
    var ordered = (tab === 'write' || tab === 'verse') ? mine.slice().reverse() : mine;
    var slice = ordered.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);
    var groups = [], index = {};
    slice.forEach(function(p){
      var key = seriesName(p);
      if (!(key in index)) { index[key] = groups.length; groups.push({ name: key, items: [] }); }
      groups[index[key]].items.push(p);
    });

    listEl.innerHTML = groups.map(function(g){
      return '<section class="series">'
        + (g.name ? '<div class="series-name">' + esc(g.name) + '</div>' : '')
        + g.items.map(card).join('')
        + '</section>';
    }).join('');

    listEl.querySelectorAll('.post:not(.flat)').forEach(function(el){
      el.addEventListener('click', function(){ openPost(find(el.dataset.stamp)); });
    });
    listEl.querySelectorAll('.dl').forEach(function(el){
      el.addEventListener('click', function(e){ e.stopPropagation(); });
    });

    renderPager();

    if (home && mine[0] && pick(mine[0])) {
      fitViewport(true);
      var mark = document.createElement('div');
      mark.className = 'latest-mark';
      mark.textContent = UI[lang].latest;
      latestEl.appendChild(mark);
      load(mine[0], latestEl, function(){ latestEl.hidden = false; });
    }
  }

  // 술어는 글이 아니라 lexicon.json 의 항목이며 눌러 펼친다
  function renderLexicon(){
    if (!lexicon) {
      listEl.innerHTML = '';
      fetch('lexicon.json?t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d){ lexicon = d || []; sortTerms(); if (tab === 'lexicon') renderList(); })
        .catch(function(){ lexicon = []; if (tab === 'lexicon') renderList(); });
      return;
    }

    var mine = lexicon.filter(function(t){ return t[lang] && t[lang].term; });
    if (!mine.length) {
      listEl.innerHTML = '<div class="empty">' + UI[lang].lexEmpty + '</div>';
      return;
    }

    listEl.innerHTML = mine.map(function(t){
      var v = t[lang];
      var alt = (t[lang === 'ko' ? 'en' : 'ko'] || {}).term || '';
      return '<div class="lex-item" data-key="' + esc(t.key || '') + '">'
        + '<div class="lex-head"><span class="lex-term">' + esc(v.term) + '</span>'
        + (alt ? '<span class="lex-alt">' + esc(alt) + '</span>' : '') + '</div>'
        + (v.short ? '<div class="lex-short">' + esc(v.short) + '</div>' : '')
        + '</div>';
    }).join('');

    listEl.querySelectorAll('.lex-item').forEach(function(el){
      el.addEventListener('click', function(){ toggleTerm(el); });
    });
  }

  function sortTerms(){
    lexicon.sort(function(a, b){
      var x = (a[lang] || a.ko || a.en || {}).term || '';
      var y = (b[lang] || b.ko || b.en || {}).term || '';
      return x.localeCompare(y, lang === 'ko' ? 'ko' : 'en');
    });
  }

  function toggleTerm(el){
    var open = el.querySelector('.lex-body');
    if (open) { el.removeChild(open); var s = el.querySelector('.lex-see'); if (s) el.removeChild(s); return; }

    var t = findTerm(el.dataset.key);
    if (!t) return;
    var v = t[lang] || {};

    var body = document.createElement('div');
    body.className = 'lex-body';
    body.innerHTML = String(v.body || v.short || '').split('\n\n')
      .map(function(par){ return '<p>' + esc(par) + '</p>'; }).join('');
    el.appendChild(body);

    if (t.see && t.see.length) {
      var see = document.createElement('div');
      see.className = 'lex-see';
      see.innerHTML = t.see.map(function(k){
        var o = findTerm(k);
        var n = o ? ((o[lang] || o.ko || o.en || {}).term || k) : k;
        return '<span>' + esc(n) + '</span>';
      }).join('');
      el.appendChild(see);
    }
  }

  function findTerm(key){
    for (var i = 0; i < (lexicon || []).length; i++) if (lexicon[i].key === key) return lexicon[i];
    return null;
  }

  // 앞뒤 두 칸과 양 끝만 남기고 사이는 생략표로 접는다
  function renderPager(){
    var total = pageCount();
    if (total < 2) return;

    add('‹', page - 1, false, page === 0);
    var last = -1;
    for (var i = 0; i < total; i++) {
      if (i > 1 && i < total - 2 && Math.abs(i - page) > 1) continue;
      if (last >= 0 && i - last > 1) {
        var gap = document.createElement('span');
        gap.className = 'pg-gap';
        gap.textContent = '…';
        pagerEl.appendChild(gap);
      }
      add(String(i + 1), i, i === page, false);
      last = i;
    }
    add('›', page + 1, false, page === total - 1);

    pagerEl.hidden = false;

    function add(label, target, on, off){
      var b = document.createElement('button');
      b.className = 'pg' + (on ? ' on' : '');
      b.textContent = label;
      b.disabled = !!off || !!on;
      if (!off && !on) b.addEventListener('click', function(){ goPage(target); });
      pagerEl.appendChild(b);
    }
  }

  // 가장 최근 로그는 처음 화면에만 걸어 둔다
  function renderNotice(){
    noticeEl.hidden = true;
    noticeEl.innerHTML = '';
    if (!home) return;

    var latest = tabPosts('notice')[0];
    if (!latest || !pick(latest)) return;
    fitViewport(true);

    var mark = document.createElement('div');
    mark.className = 'notice-mark';
    mark.textContent = UI[lang].notice;
    noticeEl.appendChild(mark);
    load(latest, noticeEl, function(){ noticeEl.hidden = false; });
  }

  function seriesName(p){
    var s = p.series;
    if (!s) return '';
    return typeof s === 'string' ? s : (s[lang] || s.ko || s.en || '');
  }

  function seriesNo(p){
    var name = seriesName(p);
    if (!p.no || !name) return '';
    return '<' + name + (lang === 'en' ? ' ' : '') + p.no + '>';
  }

  function pick(p){
    var v = p[lang];
    if (v && v.file) return { v: v, fell: false };
    v = p.ko || p.en;
    return v && v.file ? { v: v, fell: true } : null;
  }

  // 본문 없이 내려받을 것만 있는 항목도 카드로 선다
  function card(p){
    var got = pick(p);
    var meta = got ? got.v : (p[lang] || p.ko || p.en || {});
    var foot = [];

    if (got && got.fell) foot.push('<span class="tag fallback">' + UI[lang].fallback + '</span>');
    (p.tags || []).forEach(function(t){ foot.push('<span class="tag">' + esc(t) + '</span>'); });
    if (p.download) {
      foot.push('<a class="dl" href="' + esc(p.download) + '" download>'
        + esc(p.downloadLabel || 'DOWNLOAD') + '</a>');
    }

    return '<div class="post' + (got ? '' : ' flat') + '" data-stamp="' + esc(p.stamp) + '">'
      + '<div class="post-stamp">' + esc(seriesNo(p) || p.stamp || '') + '</div>'
      + '<div class="card-title">' + esc(meta.title || '') + '</div>'
      + (meta.lede ? '<div class="post-lede">' + esc(meta.lede) + '</div>' : '')
      + (foot.length ? '<div class="card-foot">' + foot.join('') + '</div>' : '')
      + '</div>';
  }

  // 글 HTML 에서 본문만 떼어 온다. 이미지 경로는 목록 기준으로 옮긴다
  function load(post, target, done){
    var got = pick(post);
    if (!got) return;
    var file = got.v.file;

    if (cache[file]) { paint(target, cache[file], done); return; }

    fetch(file + '?t=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var parts = doc.querySelectorAll('.post-head, .epigraph, .ep-trans, main, .gloss');
        if (!parts.length) return;

        var frag = document.createDocumentFragment();
        Array.prototype.forEach.call(parts, function(el){
          frag.appendChild(document.importNode(el, true));
        });

        var base = file.replace(/[^/]+$/, '');
        Array.prototype.forEach.call(frag.querySelectorAll('img'), function(img){
          var src = img.getAttribute('src') || '';
          if (src && src.charAt(0) !== '/' && src.indexOf('://') < 0) {
            img.setAttribute('src', base + src);
          }
        });

        cache[file] = frag;
        paint(target, frag, done);
      })
      .catch(function(){});
  }

  function paint(target, frag, done){
    if (target === bodyEl) target.innerHTML = '';
    target.appendChild(frag.cloneNode(true));
    if (done) done();
  }

  // 영상 구간은 지정 장면 한 장으로 세워 두고, 누르면 그 자리에 구간 재생 창을 넣는다
  function playClip(e){
    var b = e.target.closest && e.target.closest('.clip-play');
    if (!b) return;
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + b.dataset.yt + '?start=' + b.dataset.start + '&end=' + b.dataset.end + '&autoplay=1';
    f.title = b.getAttribute('aria-label');
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.allowFullscreen = true;
    b.replaceWith(f);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
