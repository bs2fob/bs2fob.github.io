# edit_post.yml
name: edit_post

on:
  workflow_dispatch:
    inputs:
      file:
        required: true
        type: string
      edits:
        required: true
        type: string
      title:
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency: admin_post

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 문구 수정과 피드 재생성
        env:
          FILE: ${{ inputs.file }}
          EDITS: ${{ inputs.edits }}
          TITLE: ${{ inputs.title }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 tools/edit_post.py
          python3 tools/gen_feed.py
      - name: 커밋
        env:
          FILE: ${{ inputs.file }}
        run: |
          git config user.name "bs2fob"
          git config user.email "bs2fob@users.noreply.github.com"
          git add -A
          git commit -m "Edit $FILE"
          git push
      - name: 사이트 다시 빌드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
