# new_log.yml
name: new_log

on:
  workflow_dispatch:
    inputs:
      stamp:
        required: true
        type: string
      title:
        required: true
        type: string
      lede:
        required: false
        type: string
      slug:
        required: false
        type: string
      body:
        required: true
        type: string

permissions:
  contents: write
  pages: write

concurrency: admin_post

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 로그 추가와 피드 재생성
        env:
          STAMP: ${{ inputs.stamp }}
          TITLE: ${{ inputs.title }}
          LEDE: ${{ inputs.lede }}
          SLUG: ${{ inputs.slug }}
          BODY: ${{ inputs.body }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 tools/new_log.py
          python3 tools/gen_feed.py
      - name: 커밋
        env:
          STAMP: ${{ inputs.stamp }}
        run: |
          git config user.name "bs2fob"
          git config user.email "bs2fob@users.noreply.github.com"
          git add -A
          git commit -m "Add log $STAMP"
          git push
      - name: 사이트 다시 빌드
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
